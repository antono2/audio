name: Audio validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: audio-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VJOBS: '2'
      V_MACOS_V3_NO_FALLBACK: '1'
      VFLAGS: '-gc none'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: vlang/v
          ref: c9b806b294234408af3794f419439599a293a0ea
          path: .cache/v
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: vlang/vc
          ref: 21490f7811a2dd366c3daa39bef8e53c1e3e5727
          path: .cache/v/vc
          persist-credentials: false
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
          install-dependencies: false
      - name: Build pinned compiler and validate
        run: v run scripts/ci.vsh .cache/v
